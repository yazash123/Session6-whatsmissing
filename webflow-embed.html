<!-- What's Missing: paste into ONE Webflow Code Embed, in a full-width section (not a Container). -->
<div id="hotp-missing-wrap" style="width:100%;margin:0;padding:0">
  <iframe id="hotp-missing"
    title="What's missing from the risk map?"
    data-src="https://yazash123.github.io/Session6-whatsmissing/"
    allow="clipboard-write"
    style="display:block;width:100%;height:100vh;height:100dvh;border:0;background:#fff"></iframe>
</div>
<script>
(function(){
  var f=document.getElementById('hotp-missing'), base=f.getAttribute('data-src');
  // Room links: put #g1 to #g26 on the end of the Webflow page address to open that room
  // (#supp opens the supplementary risks, #example the example room).
  function pass(){
    var h=/^#(g([1-9]|1[0-9]|2[0-6])|supp|example)$/.test(location.hash)?location.hash:'';
    if(f.getAttribute('src')!==base+h) f.setAttribute('src',base+h);
  }
  pass(); window.addEventListener('hashchange',pass);
})();
</script>
